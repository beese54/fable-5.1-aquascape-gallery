 for(let i=0;i<72000;i++){const px=rnd()*W,py=rnd()*H;const m=sandMask(px/W*60-30,-15+py/H*30);const sand=rnd()<m;const r=sand?0.7+rnd()*1.4:1.5+rnd()*2.6;const cols=sand?sandCols:soilCols;

 x.globalAlpha=1;for(let i=0;i<60;i++){const gx=rnd()*W,gy=rnd()*H,gr=x.createRadialGradient(gx,gy,0,gx,gy,60+rnd()*120);gr.addColorStop(0,rnd()<0.5?'rgba(0,0,0,0.18)':'rgba(120,90,60,0.12)');gr.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=gr;x.fillRect(0,0,W,H)}

const WOOD=[
 {p:[[-8.5,3.4,6.5],[-6,7.2,5.5],[-2.8,10.4,4],[1.8,13.4,2],[7.2,16.4,0],[13,20.2,-2.5],[17.6,23.6,-5]],r0:1.0,r1:0.22},
 {p:[[1.8,13.4,2],[0.2,15.8,1],[-1.2,18.6,-0.5],[-1.8,21.4,-2]],r0:0.48,r1:0.14},

function branchGeo(def,bi){const pts=def.p.map(p=>new THREE.Vector3(...p));const curve=new THREE.CatmullRomCurve3(pts,false,'catmullrom',0.5);const len=curve.getLength();const N=Math.max(14,Math.round(len*2.4)),R=12;const fr=curve.computeFrenetFrames(N,false);const pos=[],uv=[],idx=[];const sd=bi*7.3;
 const radAt=t=>lerp(def.r0,def.r1,t)*(1+0.5*(noise(t*6+sd,sd)-0.5));
 for(let i=0;i<=N;i++){const t=i/N;const p=curve.getPointAt(t);const rad=radAt(t)*(t>0.92?Math.max(0.35,1-(t-0.92)/0.08*0.65):1);const nn=fr.normals[i],bb=fr.binormals[i];
  for(let j=0;j<=R;j++){const a=j/R*TAU;const bump=1+(noise(t*14+sd,a*1.4+sd*2)-0.5)*0.5+(noise(t*45+sd,a*3.5)-0.5)*0.14;const rr=rad*bump*(1+0.2*Math.cos(a*2+sd));const ca=Math.cos(a),sa=Math.sin(a);
   pos.push(p.x+(nn.x*ca+bb.x*sa)*rr,p.y+(nn.y*ca+bb.y*sa)*rr,p.z+(nn.z*ca+bb.z*sa)*rr);uv.push(j/R*1.5,t*len/4)}}
 for(let i=0;i<N;i++)for(let j=0;j<R;j++){const a=i*(R+1)+j,b=a+1,c=a+R+1,d=c+1;idx.push(a,b,c,b,d,c)}

  {path:pRock(r2,[8.3,9.5,10.8]),type:'cherry',sc:0.75,up:p=>rockNormal(r2,p)}];
 for(const d of defs){const pl=pathLen(d.path);const mk=makeShrimp(d.type,d.sc);scene.add(mk.g);shrimps.push({path:d.path,seg:pl.seg,L:pl.L,up:d.up,sc:d.sc,g:mk.g,legPos:mk.legPos,legAttr:mk.legAttr,s:Math.random(),dir:Math.random()<0.5?-1:1,speed:0.12+Math.random()*0.1,moving:false,timer:Math.random()*3,walk:0})}}
function updateLegs(sh,w){const a=sh.legPos;let k=0;const put=(x,y,z)=>{a[k++]=x;a[k++]=y;a[k++]=z};
 for(let i=0;i<5;i++)for(const sd of [-1,1]){const ph=w+i*1.1+(sd>0?0.5:0);const hx=0.5-i*0.2;const kx=hx-0.08+Math.sin(ph)*0.14,ky=-0.5,kz=sd*0.3;const fx=kx-0.12+Math.sin(ph)*0.1,fy=-0.72,fz=sd*0.36;put(hx,-0.3,sd*0.16);put(kx,ky,kz);put(kx,ky,kz);put(fx,fy,fz)}
 for(const sd of [-1,1]){const s1=Math.sin(w*0.4+sd)*0.08;put(0.95,0.12,sd*0.06);put(1.6,0.32+s1,sd*0.18);put(1.6,0.32+s1,sd*0.18);put(2.3,0.5+s1*2,sd*0.3);put(0.95,0.05,sd*0.06);put(1.5,0.1+s1,sd*0.12)}
 sh.legAttr.needsUpdate=true}
function updShrimp(sh,dt){sh.timer-=dt;
 if(sh.timer<=0){if(sh.moving){sh.moving=false;sh.timer=1.5+Math.random()*4}else{sh.moving=true;sh.timer=2+Math.random()*4;if(Math.random()<0.35)sh.dir*=-1}}
 if(sh.moving){sh.s+=sh.dir*sh.speed*dt/sh.L*sh.L*0.9;if(sh.s>1){sh.s=1;sh.dir=-1}if(sh.s<0){sh.s=0;sh.dir=1}sh.walk+=dt*9}else sh.walk+=dt*1.2;
 const r=pathAt(sh,sh.s);const up=sh.up(r.p);if(up.y<0.1){up.y=0.3;up.normalize()}const fwd=r.tg.clone().multiplyScalar(sh.dir);fwd.addScaledVector(up,-up.dot(fwd));if(fwd.lengthSq()<1e-6)fwd.set(1,0,0);fwd.normalize();
 sh.g.position.copy(r.p).addScaledVector(up,0.45*sh.sc);_q.setFromRotationMatrix(basisFrom(fwd,up));sh.g.quaternion.slerp(_q,Math.min(1,dt*4));updateLegs(sh,sh.walk)}

/* ---------------- bubbles & particles ---------------- */
const SRC=[{x:DIFF.x,y:DIFF.y+0.15,z:DIFF.z,r0:0.035,r1:0.095,sp:2.2,dl:0.5,jx:0.55,n:150},{x:1.8,y:14.5,z:2.8,r0:0.03,r1:0.06,sp:1.5,dl:9,jx:1.2,n:7},{x:-2.6,y:11.6,z:4.8,r0:0.03,r1:0.06,sp:1.5,dl:12,jx:1.0,n:6}];
const bubbles=[];for(const s of SRC)for(let i=0;i<s.n;i++)bubbles.push({src:s});
function resetB(b,init){const s=b.src;b.x=s.x+(Math.random()-0.5)*s.jx;b.z=s.z+(Math.random()-0.5)*s.jx;b.y=init?s.y+Math.random()*(SURF-s.y):s.y;b.r=s.r0+Math.random()*(s.r1-s.r0);b.ph=Math.random()*TAU;b.wf=1.5+Math.random()*2.5;b.sp=s.sp*(0.8+Math.random()*0.5);b.delay=init?0:Math.random()*s.dl}
for(const b of bubbles)resetB(b,true);
const bubMesh=new THREE.InstancedMesh(new THREE.SphereGeometry(1,8,6),new THREE.MeshPhysicalMaterial({color:0xcfe9ff,transparent:true,opacity:0.4,roughness:0.05,metalness:0,envMap:envTex,envMapIntensity:1.4,depthWrite:false}),bubbles.length);bubMesh.frustumCulled=false;scene.add(bubMesh);
function updBubbles(dt,t){const I=new THREE.Quaternion();for(let i=0;i<bubbles.length;i++){const b=bubbles[i];if(b.delay>0){b.delay-=dt;_s.set(0,0,0);_m.compose(_v.set(0,-10,0),I,_s);bubMesh.setMatrixAt(i,_m);continue}
  b.y+=b.sp*(0.7+b.r*6)*dt;b.x+=Math.sin(t*b.wf+b.ph)*0.25*dt-0.08*dt;b.z+=Math.cos(t*b.wf*0.8+b.ph)*0.2*dt;if(b.y>SURF-b.r)resetB(b,false);
  _s.set(b.r,b.r*0.92,b.r);_m.compose(_v.set(b.x,b.y,b.z),I,_s);bubMesh.setMatrixAt(i,_m)}bubMesh.instanceMatrix.needsUpdate=true}
const parts=[];for(let i=0;i<70;i++)parts.push({x:-29+Math.random()*58,y:4+Math.random()*22,z:-14+Math.random()*28,ph:Math.random()*TAU});
const partPos=new Float32Array(parts.length*3);const partGeo=new THREE.BufferGeometry();const partAttr=new THREE.BufferAttribute(partPos,3);partGeo.setAttribute('position',partAttr);
const dotTex=(()=>{const c=mkCanvas(32,32),x=c.getContext('2d');const gr=x.createRadialGradient(16,16,0,16,16,16);gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(0.4,'rgba(255,255,255,0.5)');gr.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=gr;x.fillRect(0,0,32,32);const t=new THREE.CanvasTexture(c);return t})();
scene.add(new THREE.Points(partGeo,new THREE.PointsMaterial({size:0.16,map:dotTex,transparent:true,opacity:0.35,depthWrite:false,color:0xdff0f0,sizeAttenuation:true})));
function updParts(dt,t){for(let i=0;i<parts.length;i++){const p=parts[i];p.x+=(-0.15+Math.sin(t*0.25+p.ph)*0.12)*dt;p.y+=(Math.sin(t*0.4+p.ph*2)*0.08-0.015)*dt;p.z+=Math.cos(t*0.3+p.ph)*0.1*dt;if(p.x<-29.5)p.x+=59;if(p.y<3.5){p.y=20+Math.random()*6}p.z=clamp(p.z,-14.5,14.5);partPos[i*3]=p.x;partPos[i*3+1]=p.y;partPos[i*3+2]=p.z}partAttr.needsUpdate=true}

/* ---------------- camera & loop ---------------- */
const CAM_DIR=new THREE.Vector3(0.62,0.44,1).normalize(),CAM_CENTER=new THREE.Vector3(0,13.5,0);let camDist=80;
function fit(){camera.aspect=innerWidth/innerHeight;const vf=THREE.MathUtils.degToRad(camera.fov);const hf=2*Math.atan(Math.tan(vf/2)*camera.aspect);camDist=Math.max(36/Math.tan(hf/2),24/Math.tan(vf/2))*1.06;scene.fog.near=camDist-12;scene.fog.far=camDist+100;camera.updateProjectionMatrix()}
function resize(){renderer.setPixelRatio(Math.min(2,window.devicePixelRatio||1));renderer.setSize(innerWidth,innerHeight);fit()}
window.addEventListener('resize',resize);fit();
const clock=new THREE.Clock();let last=0;
renderer.setAnimationLoop(()=>{const t=clock.getElapsedTime();const dt=clamp(t-last,0.001,0.05);last=t;U.uTime.value=t;
 updBetta(dt,t);updSchool(dt,t);for(const sh of shrimps)updShrimp(sh,dt);updBubbles(dt,t);updParts(dt,t);updFloaters(t);
 waterNormal.offset.set(t*0.012,t*0.007);waterNormal2.offset.set(-t*0.009,t*0.011);
 const ca=t*0.03;spot.shadow.camera.up.set(Math.sin(ca),0,Math.cos(ca));spot.position.set(1+Math.sin(t*0.21)*1.4,44,3+Math.cos(t*0.17)*1.2);
 const ang=Math.sin(t*0.07)*0.02;_v.copy(CAM_DIR).applyAxisAngle(UP,ang);camera.position.copy(CAM_CENTER).addScaledVector(_v,camDist);camera.position.y+=Math.sin(t*0.05)*0.5;camera.lookAt(CAM_CENTER);
 renderer.render(scene,camera)});
</script>
