const PI=Math.PI,TAU=PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const sq=v=>v*v;
function mkRng(seed){let s=seed>>>0;return function(){s=(s+0x6D2B79F5)>>>0;let t=s;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296;};}
function hash3(x,y,z){const n=Math.sin(x*127.1+y*311.7+z*74.7)*43758.5453;return n-Math.floor(n);}
function vnoise(x,y,z){
 const xi=Math.floor(x),yi=Math.floor(y),zi=Math.floor(z);
 const xf=x-xi,yf=y-yi,zf=z-zi;
 const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf),w=zf*zf*(3-2*zf);
 const h=(i,j,k)=>hash3(xi+i,yi+j,zi+k);
 return lerp(lerp(lerp(h(0,0,0),h(1,0,0),u),lerp(h(0,1,0),h(1,1,0),u),v),lerp(lerp(h(0,0,1),h(1,0,1),u),lerp(h(0,1,1),h(1,1,1),u),v),w);
}

function canvasTex(c,srgb){const t=new THREE.CanvasTexture(c);if(srgb)t.colorSpace=THREE.SRGBColorSpace;t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy());return t;}

function makeCaustic(){
 const N=256,pts=[],r=mkRng(9);
 for(let i=0;i<48;i++)pts.push([r()*N,r()*N]);
 const data=new Uint8Array(N*N*4);
 for(let y=0;y<N;y++)for(let x=0;x<N;x++){
  let d1=1e9,d2=1e9;
  for(const p of pts){let dx=Math.abs(x-p[0]);if(dx>N/2)dx=N-dx;let dy=Math.abs(y-p[1]);if(dy>N/2)dy=N-dy;const d=dx*dx+dy*dy;if(d<d1){d2=d1;d1=d;}else if(d<d2)d2=d;}
  const e=Math.sqrt(d2)-Math.sqrt(d1);
  const v=Math.pow(Math.exp(-e*0.25),1.5);
  const i=(y*N+x)*4;data[i]=data[i+1]=data[i+2]=Math.round(v*255);data[i+3]=255;
 }
 const t=new THREE.DataTexture(data,N,N);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.minFilter=THREE.LinearMipmapLinearFilter;t.magFilter=THREE.LinearFilter;t.generateMipmaps=true;t.needsUpdate=true;return t;
}
function makeSubstrateTex(){

 x.fillStyle='#2a1d15';x.fillRect(0,0,W,H);bx.fillStyle='#7a7a7a';bx.fillRect(0,0,W,H);

 for(let i=0;i<32000;i++){
  const px=r()*W,py=r()*H,X=px/W*60-30,Z=15-py/H*30;
  const sand=r()<sandAmt(X,Z);
  let col,s;
  if(sand){const v=Math.floor(150+r()*85);col=`rgb(${v+22},${v+6},${v-28})`;s=1.4+r()*2;}
  else{const v=Math.floor(18+r()*58);col=`rgb(${v+24},${v+11},${v+2})`;s=2.2+r()*3.6;}
  x.globalAlpha=0.55+r()*0.45;x.fillStyle=col;x.beginPath();x.arc(px,py,s,0,TAU);x.fill();
  const l=Math.floor(60+r()*150);bx.fillStyle=`rgb(${l},${l},${l})`;bx.beginPath();bx.arc(px,py,s*0.9,0,TAU);bx.fill();
 }
 x.globalAlpha=1;
 return{map:canvasTex(c,true),bump:canvasTex(b,false)};
}

 }

/* ------------------------------------------------------------------ underwater shading (caustics + depth tint) */
const uTime={value:0};
const causticTex=makeCaustic();
function aquaMat(m,opt){
 opt=opt||{};
 m.onBeforeCompile=(sh)=>{
  sh.uniforms.uTime=uTime;
  sh.uniforms.uCaustic={value:causticTex};
  sh.vertexShader=sh.vertexShader
   .replace('#include <common>','#include <common>\nvarying vec3 vWP;\n'+(opt.vDecl||''))
   .replace('#include <begin_vertex>','#include <begin_vertex>\n'+(opt.vBody||'')+`
	vec4 aqWP = vec4( transformed, 1.0 );
	#ifdef USE_INSTANCING
	aqWP = instanceMatrix * aqWP;
	#endif
	vWP = ( modelMatrix * aqWP ).xyz;`);
  sh.fragmentShader=sh.fragmentShader
   .replace('#include <common>','#include <common>\nvarying vec3 vWP;\nuniform float uTime;\nuniform sampler2D uCaustic;')
   .replace('#include <lights_fragment_end>',`#include <lights_fragment_end>
	{
		vec3 aqN = inverseTransformDirection( normal, viewMatrix );
		float aqUp = clamp( aqN.y, 0.0, 1.0 );
		vec2 cuv = vWP.xz * 0.045;
		float c1 = texture2D( uCaustic, cuv + vec2( uTime * 0.011, uTime * 0.006 ) ).r;
		float c2 = texture2D( uCaustic, cuv * 1.37 + vec2( -uTime * 0.008, uTime * 0.012 ) + 0.31 ).r;
		float caus = c1 * c2 * 2.6;
		float depthF = clamp( ( 28.2 - vWP.y ) / 26.0, 0.0, 1.0 );
		float causAmt = 0.6 * ( 1.0 - 0.35 * depthF );
		reflectedLight.directDiffuse *= 1.0 + caus * aqUp * causAmt;
		reflectedLight.directSpecular *= 1.0 + caus * aqUp * 0.3;
	}`)
   .replace('#include <fog_fragment>',`
	{
		float depthF = clamp( ( 28.2 - vWP.y ) / 26.0, 0.0, 1.0 );
		gl_FragColor.rgb *= mix( vec3( 1.0 ), vec3( 0.80, 0.90, 0.96 ), depthF * 0.55 );
	}
	#include <fog_fragment>`);
 };
 m.customProgramCacheKey=()=>'aqua|'+(opt.key||'');
 return m;
}

function polyRadius(poly,cx,cy,ang){

}

const NPART=45;
const partIM=new THREE.InstancedMesh(new THREE.SphereGeometry(0.06,5,4),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0.4,depthWrite:false}),NPART);
partIM.frustumCulled=false;partIM.instanceMatrix.setUsage(THREE.DynamicDrawUsage);scene.add(partIM);
const parts=[];
for(let i=0;i<NPART;i++)parts.push({x:-30+Math.random()*60,y:9+Math.random()*17,z:-12+Math.random()*24,ph:Math.random()*TAU});
function updateParticles(dt,t){
 for(let i=0;i<NPART;i++){
  const p=parts[i];
  p.x+=(-0.35-0.2*Math.cos(p.y*0.3+p.ph))*dt;p.y+=0.15*Math.sin(t*0.5+p.ph)*dt;p.z+=0.1*Math.sin(t*0.3+p.ph*2)*dt;
  if(p.x<-29.5){p.x=29.5;p.y=9+Math.random()*17;}
  const fl=subH(p.x,p.z)+0.6;if(p.y<fl)p.y=fl;if(p.y>WL-0.5)p.y=WL-0.5;
  p.z=clamp(p.z,-14,14);
  _m.makeTranslation(p.x,p.y,p.z);partIM.setMatrixAt(i,_m);
 }
 partIM.instanceMatrix.needsUpdate=true;
}

/* ------------------------------------------------------------------ camera */
const camDir=new THREE.Vector3(0.62,0.40,1.0).normalize();
const camTarget=new THREE.Vector3(1,13.5,0);
const camBase=new THREE.Vector3();
const corners=[];
for(const x of[-32,32])for(const y of[-1,35])for(const z of[-17,17])corners.push(new THREE.Vector3(x,y,z));
function fitCamera(){
 camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();
 let dist=90;
 for(let it=0;it<6;it++){
  camera.position.copy(camTarget).addScaledVector(camDir,dist);camera.lookAt(camTarget);camera.updateMatrixWorld();
  let mx=0;
  for(const c of corners){_P.copy(c).project(camera);mx=Math.max(mx,Math.abs(_P.x),Math.abs(_P.y));}
  dist*=mx/0.9;
 }
 dist=clamp(dist,40,400);
 camBase.copy(camTarget).addScaledVector(camDir,dist);
 camera.position.copy(camBase);camera.lookAt(camTarget);
 scene.fog.near=dist-30;scene.fog.far=dist+22;
}
function onResize(){renderer.setSize(window.innerWidth,window.innerHeight);fitCamera();}
window.addEventListener('resize',onResize);
fitCamera();

/* ------------------------------------------------------------------ loop */
const clock=new THREE.Clock();
function frame(){
 requestAnimationFrame(frame);
 const dt=Math.min(0.05,clock.getDelta());
 const t=clock.elapsedTime;
 uTime.value=t;
 updateStems(t);
 updateAnubias(t);
 updateFloaters(t);
 updateFish(dt,t);
 updateShrimp(dt,t);
 updateBubbles(dt,t);
 updateParticles(dt,t);
 updateWater(t);
 camera.position.set(camBase.x+0.4*Math.sin(t*0.11),camBase.y+0.25*Math.sin(t*0.17+1),camBase.z+0.3*Math.sin(t*0.08));
 camera.lookAt(camTarget);
 renderer.render(scene,camera);
}
frame();
</script>
