<body>
<canvas id="c"></canvas>
<script>
(()=>{
'use strict';
const cv=document.getElementById('c'),g=cv.getContext('2d');
const TW=600,TH=300,SURF=24,TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const P=new Uint8Array(512);{const rp=mulberry32(5);const p=[];for(let i=0;i<256;i++)p[i]=i;for(let i=255;i>0;i--){const j=(rp()*(i+1))|0;const q=p[i];p[i]=p[j];p[j]=q}for(let i=0;i<512;i++)P[i]=p[i&255]}
function hsh(x,y){return P[(P[x&255]+(y&255))&255]/255}
function noise(x,y){const xi=Math.floor(x),yi=Math.floor(y),fx=x-xi,fy=y-yi,sx=fx*fx*(3-2*fx),sy=fy*fy*(3-2*fy);const a=hsh(xi,yi),b=hsh(xi+1,yi),c=hsh(xi,yi+1),d=hsh(xi+1,yi+1);return a+(b-a)*sx+(c-a)*sy+(a-b-c+d)*sx*sy}
const gs=(x,s)=>Math.exp(-x*x/(2*s*s));
function soilBack(x){return 236-28*gs(x-90,70)-20*gs(x-505,75)+8*gs(x-300,55)}
function soilEdge(x){return soilBack(x)+Math.sin(x*0.7)*0.4+(noise(x*0.15,3)-0.5)*2.5}
const rgb=a=>`rgb(${a[0]|0},${a[1]|0},${a[2]|0})`;
const mixc=(a,b,t)=>rgb([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t]);
function mk(w,h){const c=document.createElement('canvas');c.width=Math.max(1,Math.ceil(w));c.height=Math.max(1,Math.ceil(h));return c}

let W=0,H=0,dpr=1,tx=0,ty=0,tw=0,th=0,u=1;
const L={};
let sceneC=null,s=null;
function tankCanvas(){const c=mk(TW*u,TH*u);const x=c.getContext('2d');x.scale(u,u);return[c,x]}
function sprite(w,h,fn){const c=mk(w*u,h*u);const x=c.getContext('2d');x.scale(u,u);x.translate(w/2,h);fn(x);return{c,w,h}}

/* ---------------- scene data ---------------- */
const branches=[
 {p:[[215,260],[240,228],[272,196],[318,166],[372,136],[430,98],[476,64]],w0:19,w1:3.5},
 {p:[[318,166],[302,142],[288,114],[282,86]],w0:8.5,w1:2.2},
 {p:[[372,136],[398,150],[428,172],[452,198]],w0:7.5,w1:2.4},
 {p:[[240,228],[204,220],[164,224],[128,234]],w0:11,w1:3.5},
 {p:[[215,260],[182,262],[150,272]],w0:13,w1:4.5},
 {p:[[430,98],[450,110],[468,132]],w0:4.5,w1:1.8}
];
const plants=[],epi=[],floaters=[],shrimps=[],bubbles=[],parts=[];
const KINDS={
 rotala:{stem:[120,85,70],lo:[80,140,60],hi:[225,110,105],tip:[245,165,160],L0:9,L1:6,W:1.8,step:5,ang:1.25,mid:null,lw:0.9},
 ludwigia:{stem:[125,65,50],lo:[120,125,55],hi:[195,70,48],tip:[235,125,85],L0:14,L1:10,W:4,step:8,ang:1.0,mid:'rgba(255,220,200,0.35)',lw:1.6},
 green:{stem:[75,125,60],lo:[65,135,60],hi:[115,185,85],tip:[165,215,125],L0:10,L1:7,W:3.4,step:7,ang:1.05,mid:'rgba(220,255,210,0.3)',lw:1.4}
};
const SRC=[{x:540,y:249,r0:0.55,r1:1.3,sp:26,dl:0.4,jx:2},{x:318,y:156,r0:0.35,r1:0.7,sp:14,dl:9,jx:12},{x:272,y:186,r0:0.35,r1:0.65,sp:14,dl:12,jx:10}];
const B={x:300,y:120,vx:0,vy:0,face:1,fs:1,target:[420,100],hover:0,turn:-1,turnFrom:1,pitch:0,ph:0};
const school={x:430,y:110,vx:0,vy:0,tg:[450,100],tm:3,m:[]};

function pathLen(pts){const seg=[];let Ls=0;for(let i=0;i<pts.length-1;i++){const d=Math.hypot(pts[i+1][0]-pts[i][0],pts[i+1][1]-pts[i][1]);seg.push(d);Ls+=d}return{seg,L:Ls}}
function pathAt(sh,f){let d=f*sh.L;for(let i=0;i<sh.seg.length;i++){if(d<=sh.seg[i]||i===sh.seg.length-1){const p=sh.path[i],q=sh.path[i+1];const k=clamp(d/sh.seg[i],0,1);return[p[0]+(q[0]-p[0])*k,p[1]+(q[1]-p[1])*k,Math.atan2(q[1]-p[1],q[0]-p[0])]}d-=sh.seg[i]}return[sh.path[0][0],sh.path[0][1],0]}

function resetB(b,init){const S=b.src;b.x=S.x+(Math.random()-0.5)*S.jx;b.y=init?S.y-Math.random()*(S.y-SURF):S.y;b.r=S.r0+Math.random()*(S.r1-S.r0);b.ph=Math.random()*TAU;b.wf=1.5+Math.random()*2.5;b.sp=S.sp*(0.8+Math.random()*0.5);b.delay=init?0:Math.random()*S.dl}

function seedAll(){
 const rnd=mulberry32(7);
 const add=(kind,x,y,h,seed,layer)=>plants.push({kind,x,y,h,seed,layer,amp:0.028+rnd()*0.02,ph:rnd()*TAU,sp:null});
 for(let i=0;i<13;i++){const x=26+i*8+rnd()*5;add('ludwigia',x,soilBack(x)+1+rnd()*6,105+rnd()*55,100+i,'back')}
 for(let i=0;i<11;i++){const x=136+i*10+rnd()*5;add('green',x,soilBack(x)+rnd()*6,75+rnd()*45,200+i,'back')}
 for(let i=0;i<24;i++){const x=428+i*6.8+rnd()*5;add('rotala',x,soilBack(x)+rnd()*7,120+rnd()*85,300+i,'back')}
 for(let i=0;i<6;i++){const x=58+i*9+rnd()*4;add('green',x,248+rnd()*8,45+rnd()*25,400+i,'mid')}
 for(let i=0;i<7;i++){const x=444+i*8+rnd()*4;add('rotala',x,250+rnd()*7,55+rnd()*35,500+i,'mid')}
 plants.sort((a,b)=>a.y-b.y);
 epi.push({kind:'anubias',x:272,y:198,s:1.15,seed:11},{kind:'anubias',x:372,y:138,s:0.85,seed:12},{kind:'anubias',x:228,y:262,s:0.7,seed:13},{kind:'anubias',x:452,y:200,s:0.55,seed:14},{kind:'anubias',x:128,y:234,s:0.6,seed:15});
 epi.push({kind:'moss',x:318,y:164,w:34,h:15,seed:21},{kind:'moss',x:240,y:228,w:26,h:12,seed:22},{kind:'moss',x:430,y:97,w:18,h:9,seed:23},{kind:'moss',x:140,y:222,w:36,h:11,seed:24},{kind:'moss',x:400,y:150,w:20,h:9,seed:25});
 const groups=[[60,190,9],[455,560,6]];
 for(const [a,b,n] of groups)for(let i=0;i<n;i++){floaters.push({x:a+(b-a)*(i+0.5)/n+(rnd()-0.5)*10,r:6+rnd()*6,ph:rnd()*TAU,roots:2+(rnd()*3|0),rl:20+rnd()*40,ry:0.22+rnd()*0.1,g:[a,b]})}
 const shDefs=[{path:[[118,224],[132,218],[148,216],[162,221]],type:'cherry',sc:1},{path:[[236,262],[280,257],[330,256],[372,262]],type:'cherry',sc:0.95},{path:[[298,168],[318,156],[350,140],[372,127]],type:'amano',sc:1.3},{path:[[381,240],[395,237],[410,241]],type:'cherry',sc:0.8}];
 for(const d of shDefs){const pl=pathLen(d.path);shrimps.push({path:d.path,seg:pl.seg,L:pl.L,type:d.type,sc:d.sc,s:Math.random(),dir:Math.random()<0.5?-1:1,speed:1.2+Math.random(),moving:false,timer:Math.random()*3,walk:0})}
 for(let i=0;i<58;i++)bubbles.push({src:SRC[0]});for(let i=0;i<7;i++)bubbles.push({src:SRC[1]});for(let i=0;i<6;i++)bubbles.push({src:SRC[2]});
 for(const b of bubbles)resetB(b,true);
 for(let i=0;i<40;i++)parts.push({x:Math.random()*TW,y:SURF+4+Math.random()*225,r:0.3+Math.random()*0.5,a:0.08+Math.random()*0.18,ph:Math.random()*TAU});
 for(let i=0;i<5;i++)school.m.push({x:430+(i-2)*8,y:110+(i%2)*6,vx:1,vy:0,face:1,ox:(i-2)*9+(Math.random()-0.5)*4,oy:(i%3-1)*6+(Math.random()-0.5)*4,ph:Math.random()*TAU});
}
seedAll();

/* ---------------- sprite builders ---------------- */
function leaf(x,px,py,a,Lg,Wd,c1,c2,mid){x.save();x.translate(px,py);x.rotate(a);const gr=x.createLinearGradient(0,0,Lg,0);gr.addColorStop(0,c1);gr.addColorStop(1,c2);x.fillStyle=gr;x.beginPath();x.moveTo(0,0);x.quadraticCurveTo(Lg*0.45,-Wd,Lg,0);x.quadraticCurveTo(Lg*0.45,Wd,0,0);x.fill();if(mid){x.strokeStyle=mid;x.lineWidth=0.25;x.beginPath();x.moveTo(0.5,0);x.lineTo(Lg*0.85,0);x.stroke()}x.restore()}
function stemSprite(kind,h,seed){const K=KINDS[kind],rnd=mulberry32(seed);const w=h*0.5+50;
 return sprite(w,h+16,x=>{
  const lean=(rnd()-0.5)*0.35,bend=rnd()*0.2;const n=Math.max(4,Math.round(h/K.step));const pts=[];
  for(let i=0;i<=n;i++){const t=i/n;pts.push([lean*h*t*t+Math.sin(t*2.5+seed)*bend*8*t,-t*h])}
  x.lineCap='round';x.strokeStyle=rgb(K.stem);x.lineWidth=K.lw;x.beginPath();x.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<=n;i++)x.lineTo(pts[i][0],pts[i][1]);x.stroke();
  for(let i=1;i<=n;i++){const t=i/n,p=pts[i];const d=Math.atan2(p[1]-pts[i-1][1],p[0]-pts[i-1][0]);
   const base=mixc(K.lo,K.hi,Math.pow(t,1.3)*(0.85+rnd()*0.15));const tipc=mixc(K.hi,K.tip,Math.max(0,t-0.6)*2);
   const Lg=(K.L1+(K.L0-K.L1)*t)*(0.8+rnd()*0.4)*Math.min(1,0.4+t*0.8);
   for(let sg=-1;sg<=1;sg+=2){const a=d+sg*K.ang+(rnd()-0.5)*0.35;leaf(x,p[0],p[1],a,Lg,K.W*(0.85+rnd()*0.3),base,tipc,K.mid)}
   if(kind==='rotala'&&i%2===0)leaf(x,p[0],p[1],d+(rnd()-0.5)*0.6,Lg*0.9,K.W,base,tipc,null);
  }
  const p=pts[n];for(let k=0;k<3;k++){const a=-Math.PI/2+(k-1)*0.55+(rnd()-0.5)*0.2;leaf(x,p[0],p[1],a,K.L0*0.9,K.W*0.8,mixc(K.hi,K.tip,0.5),mixc(K.hi,K.tip,0.9),null)}
 });}
function anubLeaf(x,px,py,a,Lg,Wd){x.save();x.translate(px,py);x.rotate(a);
 const gr=x.createLinearGradient(0,-Wd/2,Lg,Wd/2);gr.addColorStop(0,'#1c4a22');gr.addColorStop(0.5,'#2f7a36');gr.addColorStop(1,'#245f2b');
 x.fillStyle=gr;x.beginPath();x.moveTo(0,0);x.bezierCurveTo(Lg*0.1,-Wd*0.75,Lg*0.75,-Wd*0.6,Lg,0);x.bezierCurveTo(Lg*0.75,Wd*0.6,Lg*0.1,Wd*0.75,0,0);x.fill();
 x.strokeStyle='rgba(0,20,0,0.25)';x.lineWidth=0.25;x.stroke();
 x.fillStyle='rgba(180,230,190,0.16)';x.beginPath();x.ellipse(Lg*0.45,-Wd*0.22,Lg*0.28,Wd*0.14,0,0,TAU);x.fill();
 x.strokeStyle='rgba(150,200,140,0.45)';x.lineWidth=0.35;x.beginPath();x.moveTo(1,0);x.lineTo(Lg*0.95,0);x.stroke();
 x.strokeStyle='rgba(150,200,140,0.2)';x.lineWidth=0.25;for(let k=1;k<5;k++){const sx=Lg*k/5;x.beginPath();x.moveTo(sx,0);x.lineTo(sx+Lg*0.18,-Wd*0.42*(1-k/6));x.moveTo(sx,0);x.lineTo(sx+Lg*0.18,Wd*0.42*(1-k/6));x.stroke()}
 x.restore()}
function anubiasSprite(sc,seed){const rnd=mulberry32(seed);const w=130*sc,h=80*sc;return sprite(w,h,x=>{x.scale(sc,sc);
 x.fillStyle='#3a4a2a';x.beginPath();x.ellipse(0,-2,9,3,0,0,TAU);x.fill();
 const n=6+(rnd()*3|0);
 for(let i=0;i<n;i++){const a=-Math.PI/2+(i/(n-1)-0.5)*2.3+(rnd()-0.5)*0.3;const len=14+rnd()*18;const px=Math.cos(a)*len,py=Math.sin(a)*len-2;
  x.strokeStyle='#3b6b2e';x.lineWidth=1;x.beginPath();x.moveTo(0,-2);x.quadraticCurveTo(px*0.4,py*0.7,px,py);x.stroke();
  const la=a+(rnd()-0.5)*0.5;const LL=13+rnd()*8,LW=(0.55+rnd()*0.15)*LL;anubLeaf(x,px,py,la,LL,LW)}
});}
function mossSprite(w,h,seed){const rnd=mulberry32(seed);return sprite(w+6,h+4,x=>{
 x.fillStyle='#22461f';x.beginPath();x.ellipse(0,-1,w/2,h*0.75,0,0,TAU);x.fill();
 const cols=['#2d6a2a','#3f8a36','#5aa94a','#79c25c','#2a5a25'];x.lineCap='round';
 const n=Math.floor(w*h*1.4);
 for(let i=0;i<n;i++){const a=rnd()*TAU,r=Math.sqrt(rnd());const px=Math.cos(a)*r*w/2,py=-Math.abs(Math.sin(a))*r*h-rnd();
  const d=rnd()*Math.PI-Math.PI/2;const Lg=1.5+rnd()*2.5;x.strokeStyle=cols[rnd()*cols.length|0];x.globalAlpha=0.5+rnd()*0.5;x.lineWidth=0.35+rnd()*0.4;x.beginPath();x.moveTo(px,py);x.lineTo(px+Math.sin(d)*Lg*0.6,py-Math.abs(Math.cos(d))*Lg);x.stroke()}
 x.globalAlpha=1;
});}

/* ---------------- static layers ---------------- */
function subPath(x){x.beginPath();x.moveTo(0,TH);for(let sx=0;sx<=TW;sx+=3)x.lineTo(sx,soilEdge(sx));x.lineTo(TW,TH);x.closePath()}
function sandPath(x){x.beginPath();x.moveTo(262,soilBack(262)+6);x.quadraticCurveTo(300,soilBack(300)+3,340,soilBack(340)+6);x.quadraticCurveTo(372,268,412,TH);x.lineTo(196,TH);x.quadraticCurveTo(232,266,262,soilBack(262)+6);x.closePath()}
function drawPipe(x){x.strokeStyle='rgba(210,235,240,0.35)';x.lineWidth=0.7;x.fillStyle='rgba(180,225,235,0.10)';
 x.beginPath();x.moveTo(573,0);x.lineTo(573,44);x.quadraticCurveTo(573,58,560,66);x.quadraticCurveTo(552,71,548,80);x.lineTo(556,84);x.quadraticCurveTo(560,74,567,70);x.quadraticCurveTo(580,62,580,44);x.lineTo(580,0);x.closePath();x.fill();x.stroke();
 x.beginPath();x.ellipse(552,82,4.5,2.5,-0.5,0,TAU);x.stroke()}
function rock(x,cx,cy,rx,ry,seed){
 let gr=x.createRadialGradient(cx+rx*0.1,0,1,cx+rx*0.1,0,rx*1.3);gr.addColorStop(0,'rgba(0,0,0,0.5)');gr.addColorStop(1,'rgba(0,0,0,0)');
 x.save();x.translate(0,cy+ry*0.85);x.scale(1,0.35);x.fillStyle=gr;x.fillRect(cx-rx*1.5,-ry*2,rx*3,ry*4);x.restore();
 const N=28,pts=[];for(let i=0;i<N;i++){const a=i/N*TAU;const r=1+(noise(Math.cos(a)*1.5+seed*3,Math.sin(a)*1.5+seed)-0.5)*0.35;pts.push([cx+Math.cos(a)*rx*r,cy+Math.sin(a)*ry*r])}
 const path=()=>{x.beginPath();const l=pts[N-1],f=pts[0];x.moveTo((l[0]+f[0])/2,(l[1]+f[1])/2);for(let i=0;i<N;i++){const p=pts[i],q=pts[(i+1)%N];x.quadraticCurveTo(p[0],p[1],(p[0]+q[0])/2,(p[1]+q[1])/2)}x.closePath()};
 gr=x.createRadialGradient(cx-rx*0.35,cy-ry*0.45,1,cx,cy,Math.max(rx,ry)*1.25);gr.addColorStop(0,'#a2a39b');gr.addColorStop(0.5,'#62645f');gr.addColorStop(1,'#26282b');
 path();x.fillStyle=gr;x.fill();
 x.save();path();x.clip();const rnd=mulberry32(seed);
 for(let i=0;i<260;i++){const px=cx+(rnd()-0.5)*2*rx,py=cy+(rnd()-0.5)*2*ry;x.fillStyle=rnd()<0.5?'rgba(255,255,255,0.09)':'rgba(0,0,0,0.14)';x.beginPath();x.arc(px,py,0.4+rnd()*1.1,0,TAU);x.fill()}
 gr=x.createLinearGradient(0,cy-ry,0,cy+ry);gr.addColorStop(0,'rgba(210,225,220,0.12)');gr.addColorStop(0.6,'rgba(0,0,0,0)');gr.addColorStop(1,'rgba(0,0,0,0.3)');x.fillStyle=gr;x.fillRect(cx-rx*2,cy-ry*2,rx*4,ry*4);
 x.restore();
 x.strokeStyle='rgba(255,255,255,0.12)';x.lineWidth=0.7;x.beginPath();x.ellipse(cx,cy,rx*0.93,ry*0.93,0,Math.PI*1.05,Math.PI*1.75);x.stroke();
 for(let i=0;i<40;i++){const px=cx+(rnd()-0.5)*2.2*rx,py=cy+ry*0.75+rnd()*ry*0.4;x.fillStyle=rnd()<0.5?'#3a2a1e':'#5a4230';x.beginPath();x.ellipse(px,py,0.6+rnd(),0.5+rnd()*0.6,rnd()*3,0,TAU);x.fill()}
}
function buildBack(){const [c,x]=tankCanvas();
 let gr=x.createLinearGradient(0,0,0,TH);gr.addColorStop(0,'#134350');gr.addColorStop(0.35,'#0d3341');gr.addColorStop(0.75,'#082230');gr.addColorStop(1,'#051720');x.fillStyle=gr;x.fillRect(0,0,TW,TH);
 gr=x.createRadialGradient(300,-40,10,300,-40,420);gr.addColorStop(0,'rgba(120,200,210,0.35)');gr.addColorStop(1,'rgba(120,200,210,0)');x.fillStyle=gr;x.fillRect(0,0,TW,TH);
 for(let i=0;i<6;i++){const cx=100+i*80,cy=90+((i*37)%70);gr=x.createRadialGradient(cx,cy,5,cx,cy,120);gr.addColorStop(0,'rgba(40,110,120,0.10)');gr.addColorStop(1,'rgba(40,110,120,0)');x.fillStyle=gr;x.fillRect(0,0,TW,TH)}
 gr=x.createLinearGradient(0,0,TW,0);gr.addColorStop(0,'rgba(0,10,15,0.4)');gr.addColorStop(0.2,'rgba(0,10,15,0)');gr.addColorStop(0.8,'rgba(0,10,15,0)');gr.addColorStop(1,'rgba(0,10,15,0.4)');x.fillStyle=gr;x.fillRect(0,0,TW,TH);
 drawPipe(x);
 gr=x.createLinearGradient(0,185,0,245);gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(1,'rgba(0,0,0,0.4)');x.fillStyle=gr;x.fillRect(0,180,TW,70);
 subPath(x);gr=x.createLinearGradient(0,200,0,TH);gr.addColorStop(0,'#4a3626');gr.addColorStop(0.35,'#33241a');gr.addColorStop(1,'#1a110c');x.fillStyle=gr;x.fill();
 x.save();subPath(x);x.clip();
 const rnd=mulberry32(42);const cols=['#5a4230','#3a2a1e','#6b5038','#2a1c13','#4d3826','#7a5a3e'];
 for(let i=0;i<9000;i++){const gx=rnd()*TW;const top=soilBack(gx);const gy=top+Math.pow(rnd(),0.8)*(TH-top);const r=0.5+rnd()*1.1*(0.6+(gy-top)/80);x.fillStyle=cols[rnd()*cols.length|0];x.globalAlpha=0.5+rnd()*0.5;x.beginPath();x.ellipse(gx,gy,r,r*0.75,rnd()*3,0,TAU);x.fill()}
 x.globalAlpha=1;
 sandPath(x);gr=x.createLinearGradient(0,238,0,TH);gr.addColorStop(0,'#d4c3a0');gr.addColorStop(1,'#ae9873');x.fillStyle=gr;x.fill();
 x.save();sandPath(x);x.clip();const sc=['#e6d9b8','#c9b58c','#a6906a','#f0e6cc','#bfa985'];
 for(let i=0;i<3500;i++){const gx=196+rnd()*216,gy=238+rnd()*62;x.fillStyle=sc[rnd()*sc.length|0];x.globalAlpha=0.5+rnd()*0.5;x.beginPath();x.arc(gx,gy,0.3+rnd()*0.6,0,TAU);x.fill()}

function pickTarget(){let nx,ny,tries=0;do{nx=75+Math.random()*450;ny=50+Math.random()*145;tries++}while(tries<20&&Math.abs(nx-B.x)<90&&Math.abs(ny-B.y)<40);B.target=[nx,ny]}
function updBetta(dt,t){
 if(B.hover>0){B.hover-=dt;B.vx*=Math.pow(0.4,dt);B.vy*=Math.pow(0.4,dt);B.vy+=Math.sin(t*0.7)*0.5*dt;B.vx+=B.face*0.3*dt}
 else{const dx=B.target[0]-B.x,dy=B.target[1]-B.y,d=Math.hypot(dx,dy);
  if(d<10){if(Math.random()<0.45)B.hover=2+Math.random()*4;else pickTarget()}
  else{const want=Math.abs(dx)>20?Math.sign(dx):B.face;
   if(want!==B.face&&B.turn<0){B.turn=0;B.turnFrom=B.face}
   const sp=B.turn>=0?0:15*Math.min(1,d/45+0.25);
   const k=Math.min(1,dt*0.8);B.vx+=(dx/d*sp-B.vx)*k;B.vy+=(dy/d*sp-B.vy)*k}}
 if(B.turn>=0){B.turn+=dt/1.3;if(B.turn>=1){B.turn=-1;B.face=-B.turnFrom;B.fs=B.face}else{B.fs=B.turnFrom*Math.cos(B.turn*Math.PI)}}
 B.x=clamp(B.x+B.vx*dt,60,540);B.y=clamp(B.y+B.vy*dt,42,212);
 const spd=Math.hypot(B.vx,B.vy);const tp=spd>1?Math.atan2(B.vy,Math.abs(B.vx)+2)*0.7:0;B.pitch+=(tp-B.pitch)*Math.min(1,dt*2);
 B.ph+=dt*(2.2+spd*0.12);
}
function updSchool(dt,t){const S=school;S.tm-=dt;const dx=S.tg[0]-S.x,dy=S.tg[1]-S.y,d=Math.max(0.01,Math.hypot(dx,dy));
 if(S.tm<=0||d<8){S.tg=[330+Math.random()*220,55+Math.random()*130];S.tm=5+Math.random()*6}
 const sp=d<30?4:9;const k=Math.min(1,dt*0.7);S.vx+=(dx/d*sp-S.vx)*k;S.vy+=(dy/d*sp-S.vy)*k;S.x+=S.vx*dt;S.y+=S.vy*dt;
 for(const m of S.m){const txp=S.x+m.ox*(1+0.2*Math.sin(t*0.5+m.ph)),typ=S.y+m.oy+Math.sin(t*0.9+m.ph)*3;const kk=Math.min(1,dt*1.6);const nx=m.x+(txp-m.x)*kk,ny=m.y+(typ-m.y)*kk;
  const vx=(nx-m.x)/dt,vy=(ny-m.y)/dt;m.vx+=(vx-m.vx)*Math.min(1,dt*3);m.vy+=(vy-m.vy)*Math.min(1,dt*3);m.x=nx;m.y=ny;
  const want=Math.abs(m.vx)>0.8?Math.sign(m.vx):(m.face>=0?1:-1);m.face+=(want-m.face)*Math.min(1,dt*2.5)}}
function updShrimp(sh,dt){sh.timer-=dt;
 if(sh.timer<=0){if(sh.moving){sh.moving=false;sh.timer=1.5+Math.random()*4}else{sh.moving=true;sh.timer=2+Math.random()*4;if(Math.random()<0.35)sh.dir*=-1}}
 if(sh.moving){sh.s+=sh.dir*sh.speed*dt/sh.L;if(sh.s>1){sh.s=1;sh.dir=-1}if(sh.s<0){sh.s=0;sh.dir=1}sh.walk+=dt*9}else sh.walk+=dt*1.2}
function updBubble(b,dt,t){if(b.delay>0){b.delay-=dt;return}b.y-=b.sp*(0.7+b.r*0.5)*dt;b.x+=(Math.sin(t*b.wf+b.ph)*2.5-1.2*(b.y<150?1:0.4))*dt;if(b.y<SURF+b.r)resetB(b,false)}
function updPart(p,dt,t){p.x+=(-1.5+Math.sin(t*0.25+p.ph)*1.2)*dt;p.y+=(Math.sin(t*0.4+p.ph*2)*0.8-0.15)*dt;if(p.x<0)p.x+=TW;if(p.x>TW)p.x-=TW;p.y=clamp(p.y,SURF+2,240);if(p.y<=SURF+2)p.y=200+Math.random()*30}
function update(dt,t){updBetta(dt,t);updSchool(dt,t);for(const sh of shrimps)updShrimp(sh,dt);for(const b of bubbles)updBubble(b,dt,t);for(const p of parts)updPart(p,dt,t)}

/* ---------------- render ---------------- */
function drawPlants(layer,t){for(const p of plants){if(p.layer!==layer||!p.sp)continue;const sp=p.sp;const sh=p.amp*(Math.sin(t*0.55+p.ph)*0.6+Math.sin(t*1.5+p.ph*1.7)*0.4)-0.012;s.save();s.translate(p.x,p.y);s.transform(1,0,sh,1,0,0);s.drawImage(sp.c,-sp.w/2,-sp.h,sp.w,sp.h);s.restore()}}
function drawEpi(t){for(const e of epi){const sp=e.sp;if(!sp)continue;s.save();if(e.kind==='anubias'){s.translate(e.x,e.y);s.rotate(Math.sin(t*0.6+e.seed)*0.015);s.drawImage(sp.c,-sp.w/2,-sp.h,sp.w,sp.h)}else{s.translate(e.x,e.y+e.h*0.45);s.drawImage(sp.c,-sp.w/2,-sp.h,sp.w,sp.h)}s.restore()}}
function drawShafts(t){s.save();s.globalCompositeOperation='lighter';
 for(let i=0;i<4;i++){const bx=235+i*48+Math.sin(t*0.13+i*1.9)*10;const w=14+i*4;const sl=-25+Math.sin(t*0.09+i)*6;const gr=s.createLinearGradient(0,SURF,0,240);gr.addColorStop(0,'rgba(190,230,235,0.10)');gr.addColorStop(0.5,'rgba(190,230,235,0.045)');gr.addColorStop(1,'rgba(190,230,235,0)');s.fillStyle=gr;s.beginPath();s.moveTo(bx,SURF);s.lineTo(bx+w,SURF);s.lineTo(bx+w*2.2+sl,240);s.lineTo(bx-w*1.2+sl,240);s.closePath();s.fill()}
 s.restore()}
function drawCaustics(t){s.save();subPath(s);s.clip();s.globalCompositeOperation='lighter';
 for(let k=0;k<2;k++){s.save();s.globalAlpha=k?0.07:0.1;s.translate(k?t*3:-t*2.2,Math.sin(t*0.3+k)*2);s.scale(0.55,0.28);s.fillStyle=L.caus[k];s.fillRect(-2000,-2000,8000,8000);s.restore()}
 s.restore()}
function drawShade(){for(const [a,b] of [[60,190],[455,560]]){const cx=(a+b)/2,hw=(b-a)/2+15;s.save();s.translate(cx,SURF+10);s.scale(1,0.75);const gr=s.createRadialGradient(0,0,0,0,0,hw*1.15);gr.addColorStop(0,'rgba(0,12,18,0.26)');gr.addColorStop(0.6,'rgba(0,12,18,0.12)');gr.addColorStop(1,'rgba(0,12,18,0)');s.fillStyle=gr;s.fillRect(-hw*1.3,-hw*1.3,hw*2.6,hw*2.6);s.restore()}}
function drawFloaters(t){
 for(const f of floaters){const ex=f.x+Math.sin(t*0.15+f.ph)*4;s.strokeStyle='rgba(225,235,215,0.5)';s.lineCap='round';
  for(let r=0;r<f.roots;r++){const ox=(r-(f.roots-1)/2)*2.2;s.lineWidth=0.55;s.beginPath();s.moveTo(ex+ox,SURF+1);const n=Math.ceil(f.rl/5);for(let k=1;k<=n;k++){const yy=SURF+1+k*5;const xx=ex+ox+Math.sin(t*0.8+k*0.7+f.ph+r)*(k*0.35)-k*0.25;s.lineTo(xx,yy)}s.stroke()}}
 for(const f of floaters){const ex=f.x+Math.sin(t*0.15+f.ph)*4;const ry=f.r*f.ry;
  s.fillStyle='#4a7a32';s.beginPath();s.ellipse(ex,SURF+0.8,f.r*0.96,ry*0.9,0,0,TAU);s.fill();
  const gr=s.createLinearGradient(0,SURF-ry-1,0,SURF+ry);gr.addColorStop(0,'#b5de7a');gr.addColorStop(0.5,'#8cc45a');gr.addColorStop(1,'#5f9a3c');s.fillStyle=gr;s.beginPath();s.ellipse(ex,SURF-0.6,f.r,ry,0,0,TAU);s.fill();
  s.fillStyle='rgba(255,255,240,0.28)';s.beginPath();s.ellipse(ex-f.r*0.25,SURF-0.6-ry*0.3,f.r*0.45,ry*0.35,0,0,TAU);s.fill();
  s.strokeStyle='rgba(30,70,25,0.35)';s.lineWidth=0.3;s.beginPath();s.ellipse(ex,SURF-0.6,f.r,ry,0,0,TAU);s.stroke()}}
function drawSurface(t){
 const rc=L.reflB,rx=rc.getContext('2d');rx.setTransform(1,0,0,1,0,0);rx.clearRect(0,0,rc.width,rc.height);
 const sy=(SURF+2)*u,sh=62*u,hh=rc.height;
 rx.save();rx.scale(1,-1);rx.translate(0,-hh);
 for(let k=0;k<6;k++){rx.drawImage(sceneC,0,sy+k*sh/6,rc.width,sh/6,Math.sin(t*1.1+k)*0.8*u,k*hh/6,rc.width,hh/6+1)}
 rx.restore();
 rx.globalCompositeOperation='destination-in';let gr=rx.createLinearGradient(0,0,0,hh);gr.addColorStop(0,'rgba(0,0,0,0.42)');gr.addColorStop(1,'rgba(0,0,0,0)');rx.fillStyle=gr;rx.fillRect(0,0,rc.width,hh);rx.globalCompositeOperation='source-over';
 s.drawImage(rc,0,SURF,TW,20);
 gr=s.createLinearGradient(0,SURF,0,SURF+7);gr.addColorStop(0,'rgba(200,240,255,0.28)');gr.addColorStop(1,'rgba(200,240,255,0)');s.fillStyle=gr;s.fillRect(0,SURF,TW,7);
 s.beginPath();for(let xx=0;xx<=TW;xx+=4){const yy=SURF+Math.sin(xx*0.06+t*1.4)*0.35+Math.sin(xx*0.13-t*0.9)*0.25;xx?s.lineTo(xx,yy):s.moveTo(xx,yy)}
 s.strokeStyle='rgba(220,245,255,0.6)';s.lineWidth=0.6;s.stroke();
 s.fillStyle='rgba(220,245,255,0.35)';s.beginPath();s.moveTo(0,SURF-3);s.quadraticCurveTo(3,SURF,8,SURF+0.3);s.lineTo(0,SURF+0.3);s.closePath();s.fill();s.beginPath();s.moveTo(TW,SURF-3);s.quadraticCurveTo(TW-3,SURF,TW-8,SURF+0.3);s.lineTo(TW,SURF+0.3);s.closePath();s.fill();
}
function renderScene(t){
 s.setTransform(u,0,0,u,0,0);
 s.drawImage(L.back,0,0,TW,TH);
 drawCaustics(t);
 drawPlants('back',t);
 for(const m of school.m){s.save();s.translate(m.x,m.y);const f=(m.face>=0?1:-1)*Math.max(0.15,Math.abs(m.face));s.scale(f*0.9,0.9);s.rotate(Math.atan2(m.vy,Math.abs(m.vx)+3)*0.5);drawTetra(s,t*8+m.ph);s.restore()}
 s.drawImage(L.wood,0,0,TW,TH);
 drawEpi(t);
 drawPlants('mid',t);
 drawShafts(t);
 for(const sh of shrimps){const p=pathAt(sh,sh.s);s.save();s.translate(p[0],p[1]);s.rotate(p[2]);s.scale(sh.dir*sh.sc,sh.sc);drawShrimp(s,sh.walk,sh.type);s.restore()}
 s.save();s.translate(B.x,B.y+Math.sin(t*0.9)*1.2);const sx=(B.fs>=0?1:-1)*Math.max(0.1,Math.abs(B.fs));s.scale(sx*0.85,0.85);s.rotate(B.pitch);drawBetta(s,B.ph);s.restore();
 drawShade();
 // particles
 s.fillStyle='rgba(220,235,235,1)';for(const p of parts){s.globalAlpha=p.a;s.beginPath();s.arc(p.x,p.y,p.r,0,TAU);s.fill()}s.globalAlpha=1;
 // bubbles
 for(const b of bubbles){if(b.delay>0)continue;s.beginPath();s.arc(b.x,b.y,b.r,0,TAU);s.fillStyle='rgba(200,235,255,0.14)';s.fill();s.strokeStyle='rgba(225,245,255,0.6)';s.lineWidth=0.25;s.stroke();s.fillStyle='rgba(255,255,255,0.75)';s.beginPath();s.arc(b.x-b.r*0.35,b.y-b.r*0.35,b.r*0.22,0,TAU);s.fill()}
 s.drawImage(L.water,0,0,TW,TH);
 drawSurface(t);
 drawFloaters(t);
}

/* ---------------- layout ---------------- */
function rebuild(){
 sceneC=mk(TW*u,TH*u);s=sceneC.getContext('2d');
 L.back=buildBack();L.wood=buildWood();L.water=buildWater();L.bg=buildBg();L.glass=buildGlass();
 L.reflB=mk(TW*u,20*u);L.reflF=mk(TW*u,th*0.32);
 L.caus=[s.createPattern(buildCaustic(3),'repeat'),s.createPattern(buildCaustic(9),'repeat')];
 for(const p of plants)p.sp=stemSprite(p.kind,p.h,p.seed);
 for(const e of epi)e.sp=e.kind==='anubias'?anubiasSprite(e.s,e.seed):mossSprite(e.w,e.h,e.seed);
}
function resize(){dpr=Math.min(2,window.devicePixelRatio||1);W=Math.max(2,Math.round(innerWidth*dpr));H=Math.max(2,Math.round(innerHeight*dpr));cv.width=W;cv.height=H;
 const m=Math.min(W,H)*0.07;tw=Math.max(40,Math.min(W-2*m,(H-2*m)*2*0.94));th=tw/2;tx=(W-tw)/2;ty=(H-th)/2-th*0.05;u=tw/TW;rebuild()}
let rt=null;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(resize,120)});
resize();

let last=performance.now();
function frame(now){const t=now/1000;const dt=clamp((now-last)/1000,0.001,0.05);last=now;
 update(dt,t);renderScene(t);
 g.setTransform(1,0,0,1,0,0);g.drawImage(L.bg,0,0);
 const rc=L.reflF,rx=rc.getContext('2d'),rh=rc.height;rx.setTransform(1,0,0,1,0,0);rx.clearRect(0,0,rc.width,rh);
 rx.save();rx.translate(0,rh);rx.scale(1,-rh/sceneC.height);rx.filter='blur('+(1.5*dpr)+'px)';rx.drawImage(sceneC,0,0);rx.restore();rx.filter='none';
 rx.globalCompositeOperation='destination-in';const gr=rx.createLinearGradient(0,0,0,rh);gr.addColorStop(0,'rgba(0,0,0,0.3)');gr.addColorStop(1,'rgba(0,0,0,0)');rx.fillStyle=gr;rx.fillRect(0,0,rc.width,rh);rx.globalCompositeOperation='source-over';
 g.drawImage(rc,tx,ty+th,tw,rh);
 g.drawImage(sceneC,tx,ty,tw,th);
 g.drawImage(L.glass,0,0);
 requestAnimationFrame(frame)}
requestAnimationFrame(frame);
})();
</script>
