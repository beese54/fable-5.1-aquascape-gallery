const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,u)=>a+(b-a)*u;
const hsl=(h,s,l,a)=>a===undefined?'hsl('+h+','+s+'%,'+l+'%)':'hsla('+h+','+s+'%,'+l+'%,'+a+')';
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let q=Math.imul(a^a>>>15,1|a);q=q+Math.imul(q^q>>>7,61|q)^q;return((q^q>>>14)>>>0)/4294967296;};}
function hash2(x,y){const n=Math.sin(x*127.1+y*311.7)*43758.5453;return n-Math.floor(n);}
function vnoise(x,y){const xi=Math.floor(x),yi=Math.floor(y),fx=x-xi,fy=y-yi,u=fx*fx*(3-2*fx),v=fy*fy*(3-2*fy);return lerp(lerp(hash2(xi,yi),hash2(xi+1,yi),u),lerp(hash2(xi,yi+1),hash2(xi+1,yi+1),u),v);}
const R0=mulberry32(20240613);

/* ---------------- geometry ---------------- */
let W=0,H=0,dpr=1,S=10,TL=0,TT=0,built=false;
const YE=-4,PK=0.005,WL=1.3;
const pf=z=>1/(1+PK*z);
const px=(x,z)=>TL+S*(30+(x-30)*pf(z));
const py=(y,z)=>TT+S*(YE+(y-YE)*pf(z));
function ysub(x,z){const u=z/30;let h=27-4.6*u;h-=1.4*Math.exp(-(x-31)*(x-31)/110)*(0.4+u);h+=0.5*Math.sin(x*0.33+1)+0.3*Math.sin(x*0.91)+0.35*Math.sin(z*0.5+x*0.2);return clamp(h,20.5,28.8);}
function sandW(x,z){const xc=9+16*Math.pow(z/30,1.1),w=5.5-2.5*(z/30);const d=Math.abs(x-xc)/w;return clamp(1.3-d*d,0,1);}
function gravelW(x,z){const d=Math.hypot((x-52)/12,(z-6)/9);return clamp(1.4-d*d,0,1)*0.9;}
let t=0,gust=1;const FL={x:0,y:0};
function flow(x,y,z,o){const dx=x-30,dy=y-15;const w=0.05*Math.exp(-(dx*dx+dy*dy)/1000);let vx=dy*w,vy=-dx*w;const jet=Math.exp(-(y-3.6)*(y-3.6)/3-Math.max(0,55-x)/16-Math.max(0,x-55.5)*1.5);vx-=5*jet;vy+=0.6*jet;o.x=vx;o.y=vy;return o;}

const PT={
 rotala:{node:0.7,stemW:0.09,leaf:u=>0.55+0.2*u,ratio:0.32,spread:0.95,h:[10,17],w:3.2,col:(u,r)=>hsl(lerp(100,16,u*u)+(r()-0.5)*10,lerp(45,72,u),lerp(30,54,u)),stem:u=>hsl(22,40,lerp(28,45,u)),vein:'rgba(255,240,220,0.25)'},
 rotalaG:{node:0.6,stemW:0.08,leaf:u=>0.7+0.1*u,ratio:0.22,spread:1.0,h:[9,15],w:3.4,col:(u,r)=>hsl(96+(r()-0.5)*14,52,lerp(28,47,u)),stem:u=>hsl(90,35,32),vein:null},
 ludwigia:{node:0.85,stemW:0.12,leaf:u=>1.05+0.25*u,ratio:0.45,spread:0.8,h:[7,12],w:4.2,col:(u,r)=>hsl(lerp(70,6,Math.min(1,u*1.5))+(r()-0.5)*8,lerp(40,72,u),lerp(30,44,u)),stem:u=>hsl(8,45,32),vein:'rgba(255,220,200,0.3)'},
 hygro:{node:1.1,stemW:0.14,leaf:u=>1.6+0.2*u,ratio:0.33,spread:0.85,h:[6,10.5],w:5,col:(u,r)=>hsl(112+(r()-0.5)*14,42,lerp(27,40,u)),stem:u=>hsl(100,30,30),vein:'rgba(220,255,200,0.3)'},
 bacopa:{node:0.65,stemW:0.13,leaf:u=>0.65,ratio:0.62,spread:1.15,h:[4,7.5],w:3,col:(u,r)=>hsl(88+(r()-0.5)*10,48,lerp(35,50,u)),stem:u=>hsl(85,35,35),vein:null},
 stauro:{node:0.5,stemW:0.08,leaf:u=>0.75,ratio:0.35,spread:1.0,h:[2.5,4],w:2.8,col:(u,r)=>hsl(105+(r()-0.5)*10,45,lerp(30,44,u)),stem:u=>hsl(100,30,30),vein:null},
 grass:{h:[4,7],w:3}
};
const plantDefs=[];
function addCluster(type,x0,x1,z0,z1,n){for(let i=0;i<n;i++){const x=lerp(x0,x1,R0()),z=lerp(z0,z1,R0());plantDefs.push({type,x,z,y:ysub(x,z)+0.25,amp:0.22+R0()*0.3,w:1.0+R0()*0.7,phase:R0()*TAU,sc:0.85+R0()*0.3,si:Math.floor(R0()*NSPR),draw:drawPlant});}}
addCluster('rotala',1,18,22,29,28);

/* ---------------- driftwood ---------------- */
const segs=[];const RW=mulberry32(4242);
function nrm(v){const l=Math.hypot(v.x,v.y,v.z)||1;return{x:v.x/l,y:v.y/l,z:v.z/l};}
function grow(p,dir,len,r,depth){if(len<1.4||r<0.14||depth>6)return;
 let q={x:p.x+dir.x*len,y:p.y+dir.y*len,z:p.z+dir.z*len};
 if(q.y<3.5){dir=nrm({x:dir.x*1.5,y:0.2,z:dir.z});q={x:p.x+dir.x*len,y:p.y+dir.y*len,z:p.z+dir.z*len};}
 q.x=clamp(q.x,3,57);q.z=clamp(q.z,3,28);q.y=Math.min(q.y,ysub(q.x,q.z)+0.5);
 const l=Math.hypot(q.x-p.x,q.y-p.y,q.z-p.z);if(l<0.8)return;
 const r1=r*0.7;segs.push({a:p,b:q,r0:r,r1:r1,zm:(p.z+q.z)/2,len:l,moss:RW()<0.55&&r>0.3});
 const d2=nrm({x:dir.x+(RW()-0.5)*0.6,y:dir.y-0.12+(RW()-0.5)*0.5,z:dir.z+(RW()-0.5)*0.5});
 grow(q,d2,len*0.8,r1,depth+1);
 if(RW()<0.75){const d3=nrm({x:dir.x+(RW()-0.5)*1.8,y:dir.y-0.35+(RW()-0.5)*0.9,z:dir.z+(RW()-0.5)*1.4});grow(q,d3,len*0.62,r1*0.85,depth+1);}
}
grow({x:25,y:ysub(25,14)+0.6,z:14},nrm({x:1,y:-0.85,z:0.15}),7.5,1.5,0);
grow({x:29.5,y:ysub(29.5,16)+0.6,z:16},nrm({x:-0.55,y:-1,z:0.25}),6,1.1,0);
grow({x:33,y:ysub(33,13)+0.5,z:13},nrm({x:0.9,y:-0.55,z:-0.3}),6.5,1.0,0);
grow({x:27,y:ysub(27,15)+0.5,z:15},nrm({x:0.7,y:-0.2,z:0.7}),6,0.9,0);
const anubias=[];
{const cands=segs.filter(sg=>sg.r0>0.4&&sg.r0<1.2&&sg.a.y>9&&sg.a.y<24&&sg.len>2).sort((a,b)=>a.a.x-b.a.x);const n=Math.min(5,cands.length);for(let i=0;i<n;i++){const sg=cands[Math.floor((i+0.5)*cands.length/n)];anubias.push({seg:sg,u:0.35+RW()*0.3});}}

/* ---------------- fish ---------------- */
const SPECIES={

function mkFish(name,opts){const sp=SPECIES[name];const f=Object.assign({sp,L:sp.L*(0.85+Math.random()*0.3),speed:sp.speed*(0.85+Math.random()*0.3),wagBase:sp.wagBase,wagK:sp.wagK,x:5+Math.random()*50,y:4+Math.random()*12,z:4+Math.random()*22,vx:0,vy:0,vz:0,yaw:Math.random()*TAU,pitch:0,ph:Math.random()*TAU,seed:Math.random()*10,seedI:Math.floor(Math.random()*1e6),tt:0,tg:{x:30,y:10,z:15},xr:[4,56],yr:[3,18],zr:[4,26],draw:drawFish},opts||{});fishes.push(f);return f;}

const shrimps=[];

mkGround('cherry',10,4,4);mkGround('cherry',31.5,4.5,3);mkGround('cherry',25,9,3);mkGround('amano',48,8,5);mkGround('cherry',14,11,3);
{const ws=segs.filter(sg=>sg.r0>0.5&&Math.abs(sg.b.y-sg.a.y)/sg.len<0.75&&sg.len>2.5);if(ws.length){mkWood('cherry',ws[0]);mkWood('amano',ws[Math.min(1,ws.length-1)]);if(ws.length>2)mkWood('cherry',ws[2]);}}

/* ---------------- floaters, dust, bubbles ---------------- */
const floaters=[];
[[11,7],[22,23],[38,5],[49,15],[31,27],[4,18]].forEach((p,i)=>{const r=mulberry32(77+i);const leaves=[],roots=[];const n=3+Math.floor(r()*3);for(let k=0;k<n;k++){const a=r()*TAU,d=r()*1.8;leaves.push({dx:Math.cos(a)*d,dz:Math.sin(a)*d*0.8,r:0.9+r()*0.7,ph:r()*TAU});}const nr=4+Math.floor(r()*4);for(let k=0;k<nr;k++)roots.push({dx:(r()-0.5)*2.5,dz:(r()-0.5)*1.5,len:3+r()*5,ph:r()*TAU,w:0.6+r()*0.6});floaters.push({x0:p[0],z0:p[1],x:p[0],z:p[1],ph:r()*TAU,leaves,roots,draw:drawRoots});});
const weed=[];for(let i=0;i<30;i++)weed.push({x0:2+R0()*56,z:1+R0()*28,ph:R0()*TAU,r:0.18+R0()*0.14});
const dust=[];for(let i=0;i<130;i++)dust.push({x:1+Math.random()*58,y:2+Math.random()*20,z:2+Math.random()*26,a:0.08+Math.random()*0.28,sz:0.7+Math.random()*1.3,ph:Math.random()*TAU});
const DIF={x:49.5,y:0,z:9};DIF.y=ysub(DIF.x,DIF.z)-0.25;
const bubbles=[],rings=[];let bAcc=0;
const ofp=[];let oAcc=0;

/* ---------------- raster layers ---------------- */
let back=null,wood=null,glass=null,sprites={};
function makeLayer(){const c=document.createElement('canvas');c.width=Math.max(1,Math.round(W*dpr));c.height=Math.max(1,Math.round(H*dpr));const g=c.getContext('2d');g.scale(dpr,dpr);return{c,g};}
const CT=document.createElement('canvas');CT.width=CT.height=256;
{const g=CT.getContext('2d');const id=g.createImageData(256,256);const d=id.data;for(let y=0;y<256;y++)for(let x=0;x<256;x++){const nx=x/256*TAU,ny=y/256*TAU;const v1=Math.sin(2*nx+1.5*Math.sin(3*ny+1)),v2=Math.sin(3*ny+1.5*Math.sin(2*nx+2)),v3=Math.sin(nx+ny+1.2*Math.sin(2*nx-ny));let v=(v1+v2+v3+3)/6;v=Math.pow(v,5);const i=(y*256+x)*4;d[i]=200;d[i+1]=240;d[i+2]=255;d[i+3]=Math.min(255,v*255);}g.putImageData(id,0,0);}

function drawLeaf(g,x,y,a,L,Wd,col,vein){g.save();g.translate(x,y);g.rotate(a);g.fillStyle=col;g.beginPath();g.moveTo(0,0);g.quadraticCurveTo(L*0.45,-Wd,L,0);g.quadraticCurveTo(L*0.45,Wd,0,0);g.fill();if(vein){g.strokeStyle=vein;g.lineWidth=0.025;g.beginPath();g.moveTo(L*0.08,0);g.lineTo(L*0.85,0);g.stroke();}g.restore();}
function makeSprite(type,seed){const T=PT[type],r=mulberry32(seed),u=S*dpr;const hcm=lerp(T.h[0],T.h[1],r()),wcm=T.w;
 const c=document.createElement('canvas');c.width=Math.max(2,Math.ceil(wcm*u));c.height=Math.max(2,Math.ceil(hcm*u));const g=c.getContext('2d');g.scale(u,u);g.lineCap='round';
 if(type==='grass'){const n=9+Math.floor(r()*6);for(let i=0;i<n;i++){const bx=wcm/2+(r()-0.5)*0.6,tipx=wcm/2+(r()-0.5)*wcm*0.9,h=hcm*(0.55+0.45*r());g.strokeStyle=hsl(100+r()*20,45,30+r()*18);g.lineWidth=0.07;g.beginPath();g.moveTo(bx,hcm);g.quadraticCurveTo(bx+(tipx-bx)*0.3,hcm-h*0.6,tipx,hcm-h);g.stroke();}return{c,wcm,hcm};}
 const n=Math.max(3,Math.round(hcm/T.node));const pts=[];let x=wcm/2,y=hcm,dir=-Math.PI/2+(r()-0.5)*0.3;const step=hcm*0.92/n;
 for(let i=0;i<=n;i++){pts.push({x,y});dir+=(r()-0.5)*0.25;dir=-Math.PI/2+(dir+Math.PI/2)*0.85;x=clamp(x+Math.cos(dir)*step,1,wcm-1);y+=Math.sin(dir)*step;}
 for(let i=0;i<n;i++){g.strokeStyle=T.stem(i/n);g.lineWidth=T.stemW*(1.1-0.6*i/n);g.beginPath();g.moveTo(pts[i].x,pts[i].y);g.lineTo(pts[i+1].x,pts[i+1].y);g.stroke();}
 for(let i=1;i<=n;i++){const tt=i/n,p=pts[i],d=Math.atan2(p.y-pts[i-1].y,p.x-pts[i-1].x);const L=T.leaf(tt)*(0.8+0.4*r()),Wd=L*T.ratio;
  for(let k=0;k<2;k++){const side=k?1:-1;const a=d+side*(T.spread+(r()-0.5)*0.35);const col=T.col(tt,r);g.globalAlpha=0.8+0.2*r();drawLeaf(g,p.x,p.y,a,L*(0.85+0.3*r()),Wd,col,T.vein);}}
 g.globalAlpha=1;return{c,wcm,hcm};}
function buildSprites(){sprites={};let k=0;for(const type in PT){sprites[type]=[];for(let i=0;i<NSPR;i++){sprites[type].push(makeSprite(type,1000+i*7+k*131));}k++;}}

function polyPath(g,pts){g.beginPath();for(let i=0;i<pts.length;i++){const p=pts[i],X=px(p[0],p[2]),Y=py(p[1],p[2]);if(i)g.lineTo(X,Y);else g.moveTo(X,Y);}g.closePath();}
function surfacePath(g){g.beginPath();for(let x=0;x<=60;x+=1){const X=px(x,0),Y=py(ysub(x,0),0);if(x===0)g.moveTo(X,Y);else g.lineTo(X,Y);}for(let x=60;x>=0;x-=1)g.lineTo(px(x,30),py(ysub(x,30),30));g.closePath();}
function backWallPath(g){polyPath(g,[[0,0,30],[60,0,30],[60,30,30],[0,30,30]]);}

function buildBack(){const L=makeLayer(),g=L.g,R=mulberry32(99);let gr;
 gr=g.createRadialGradient(W/2,H*0.45,0,W/2,H*0.45,Math.max(W,H)*0.7);gr.addColorStop(0,'#1a1d21');gr.addColorStop(1,'#07080a');g.fillStyle=gr;g.fillRect(0,0,W,H);
 gr=g.createRadialGradient(TL+30*S,TT-1*S,0,TL+30*S,TT-1*S,S*30);gr.addColorStop(0,'rgba(80,120,110,0.16)');gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.fillRect(0,0,W,H);
 backWallPath(g);gr=g.createLinearGradient(0,py(0,30),0,py(30,30));gr.addColorStop(0,'#1c3634');gr.addColorStop(0.3,'#102625');gr.addColorStop(1,'#040b0b');g.fillStyle=gr;g.fill();
 g.save();g.globalCompositeOperation='screen';backWallPath(g);g.clip();gr=g.createRadialGradient(px(28,30),py(-3,30),0,px(28,30),py(-3,30),S*36);gr.addColorStop(0,'rgba(110,180,165,0.4)');gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.fillRect(0,0,W,H);g.restore();
 polyPath(g,[[0,0,30],[60,0,30],[60,WL,30],[0,WL,30]]);g.fillStyle='rgba(0,0,0,0.45)';g.fill();
 for(const xw of [0,60]){polyPath(g,[[xw,0,0],[xw,0,30],[xw,30,30],[xw,30,0]]);gr=g.createLinearGradient(px(xw,0),0,px(xw,30),0);gr.addColorStop(0,'#0a1616');gr.addColorStop(1,'#0e1e1e');g.fillStyle=gr;g.fill();}
 {const xq=57,zq=27,f=pf(zq);const X=px(xq,zq),yb=ysub(xq,zq);g.lineCap='round';g.strokeStyle='rgba(60,80,80,0.75)';g.lineWidth=0.9*S*f;g.beginPath();g.moveTo(X,py(-0.8,zq));g.lineTo(X,py(yb-1.5,zq));g.stroke();g.strokeStyle='rgba(120,150,150,0.35)';g.lineWidth=Math.max(1,0.15*S*f);g.beginPath();g.moveTo(X-0.25*S*f,py(-0.8,zq));g.lineTo(X-0.25*S*f,py(yb-1.5,zq));g.stroke();g.strokeStyle='rgba(20,30,30,0.6)';g.lineWidth=Math.max(1,0.08*S*f);for(let k=0;k<8;k++){const yy=yb-2-k*0.5;g.beginPath();g.moveTo(X-0.35*S*f,py(yy,zq));g.lineTo(X+0.35*S*f,py(yy,zq));g.stroke();}}
 for(const xw of [0,60]){g.beginPath();for(let z=0;z<=30;z+=2){const X=px(xw,z),Y=py(ysub(xw,z),z);if(z===0)g.moveTo(X,Y);else g.lineTo(X,Y);}g.lineTo(px(xw,30),py(30,30));g.lineTo(px(xw,0),py(30,0));g.closePath();g.fillStyle='#1b140f';g.fill();
  for(let i=0;i<900;i++){const z=R()*30,f=pf(z),ys=ysub(xw,z),y=lerp(ys,30,R());g.fillStyle=hsl(20+R()*15,20+R()*15,6+R()*11);g.beginPath();g.ellipse(px(xw,z)+(xw?-1:1)*R()*0.3*S*f,py(y,z),0.1*S*f,0.07*S*f,0,0,TAU);g.fill();}}

function updateShrimp(sh,dt){if(sh.pause>0){sh.pause-=dt;sh.legPh+=dt*2.5;if(sh.pause<=0&&Math.random()<0.35)sh.dir*=-1;return;}
 sh.legPh+=dt*9;
 if(sh.mode==='ground'){sh.x+=sh.dir*sh.speed*dt;if(sh.x>sh.x0+sh.range){sh.x=sh.x0+sh.range;sh.dir=-1;}if(sh.x<sh.x0-sh.range){sh.x=sh.x0-sh.range;sh.dir=1;}}
 else{sh.t+=sh.dir*sh.speed*dt/sh.seg.len;if(sh.t>0.92){sh.t=0.92;sh.dir=-1;}if(sh.t<0.08){sh.t=0.08;sh.dir=1;}}
 if(Math.random()<dt*0.25)sh.pause=0.8+Math.random()*3;}
function updateBubbles(dt){bAcc+=dt*30;while(bAcc>1){bAcc--;bubbles.push({x:DIF.x+(Math.random()-0.5)*0.5,y:DIF.y-0.2,z:DIF.z+(Math.random()-0.5)*0.5,r:0.08+Math.random()*0.1,ph:Math.random()*TAU,wob:0.6+Math.random()*0.8});}
 for(let i=bubbles.length-1;i>=0;i--){const b=bubbles[i];const vy=4.5+b.r*22;b.y-=vy*dt;b.r+=dt*0.006;flow(b.x,b.y,b.z,FL);b.x+=(FL.x*0.6+Math.sin(t*5*b.wob+b.ph)*0.7)*dt;b.z+=Math.cos(t*4*b.wob+b.ph)*0.3*dt;b.z=clamp(b.z,2,28);b.x=clamp(b.x,1,59);
  if(b.y<WL+0.15){rings.push({x:b.x,z:b.z,age:0});bubbles.splice(i,1);}}
 for(let i=rings.length-1;i>=0;i--){rings[i].age+=dt;if(rings[i].age>0.5)rings.splice(i,1);}}
function updateOutflow(dt){oAcc+=dt*35;while(oAcc>1){oAcc--;ofp.push({x:55,y:3.5+(Math.random()-0.5)*0.9,z:12+(Math.random()-0.5)*1.6,vx:-(4+Math.random()*3),vy:(Math.random()-0.5)*1.5,vz:(Math.random()-0.5)*1.5,age:0,life:1.3+Math.random()*1.2});}
 for(let i=ofp.length-1;i>=0;i--){const p=ofp[i];p.age+=dt;if(p.age>p.life){ofp.splice(i,1);continue;}const k=1-dt*1.2;p.vx*=k;p.vy=p.vy*k+0.15*dt;p.vz*=k;p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;}}
function updateDust(dt){for(const d of dust){flow(d.x,d.y,d.z,FL);d.x+=(FL.x*0.7+Math.sin(t*0.5+d.ph)*0.15)*dt;d.y+=(FL.y*0.7+Math.cos(t*0.4+d.ph)*0.12+0.03)*dt;if(d.x<0.5)d.x=59.3;if(d.x>59.5)d.x=0.7;if(d.y<WL+0.4)d.y=WL+0.4;const yb=ysub(d.x,d.z)-0.3;if(d.y>yb)d.y=2.5;}}
function update(dt){gust=0.5+0.5*Math.sin(t*0.19)+0.25*Math.sin(t*0.47+1);
 updateFish(school,dt);for(const f of fishes)updateFish(f,dt);
 for(const sh of shrimps)updateShrimp(sh,dt);
 for(const fl of floaters){fl.x=clamp(fl.x0+0.9*Math.sin(t*0.08+fl.ph)+0.3*Math.sin(t*0.21+fl.ph*2),3,57);fl.z=clamp(fl.z0+0.5*Math.sin(t*0.06+fl.ph*1.3),1,29);}
 updateBubbles(dt);updateOutflow(dt);updateDust(dt);}

/* ---------------- render loop ---------------- */
const staticItems=plantDefs.concat([{z:19,draw:()=>ctx.drawImage(wood.back.c,0,0,W,H)},{z:11,draw:()=>ctx.drawImage(wood.front.c,0,0,W,H)},{z:9,draw:drawBubbles},{z:12.2,draw:drawPipe}]);
const items=[];const HZ=[[20,0.10],[13,0.06],[7,0.035]];
function render(){ctx.setTransform(dpr,0,0,dpr,0,0);
 ctx.drawImage(back.c,0,0,W,H);
 drawCaustics();
 items.length=0;for(const p of staticItems)items.push(p);for(const f of fishes)items.push(f);for(const sh of shrimps)items.push(sh);for(const fl of floaters)items.push(fl);
 items.sort((a,b)=>b.z-a.z);
 let hz=0;
 for(let i=0;i<items.length;i++){const it=items[i];while(hz<HZ.length&&it.z<HZ[hz][0]){haze(HZ[hz][1]);hz++;}it.draw(it);}
 drawDust();drawSurface();drawWeed();drawFloaterLeaves();drawShafts();
 ctx.drawImage(glass.c,0,0,W,H);}
let last=0;
function frame(now){if(!last)last=now;const dt=Math.min(0.05,(now-last)/1000);last=now;t+=dt;if(built){update(dt);render();}requestAnimationFrame(frame);}
function resize(){W=Math.max(1,window.innerWidth);H=Math.max(1,window.innerHeight);dpr=Math.min(window.devicePixelRatio||1,2,2600/W);
 canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);canvas.style.width=W+'px';canvas.style.height=H+'px';
 const m=Math.max(12,Math.min(W,H)*0.05);let tw=W-2*m,th=tw/2;if(th*1.04>H-2*m){th=(H-2*m)/1.04;tw=th*2;}
 S=tw/60;TL=(W-tw)/2;TT=(H-th*1.04)/2+0.55*S;
 buildSprites();back=buildBack();wood=buildWood();glass=buildGlass();built=true;}
let rt=null;
window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(resize,100);});
resize();
requestAnimationFrame(frame);
})();
</script>
